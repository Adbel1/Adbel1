<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 286" role="img" aria-label="Commits por proyecto propio">
<style>svg{--bg:#f6f4ee;--fg:#111112;--mu:#6b6a66;--ln:#d9d6cc;--ac:#e0440c}
@media(prefers-color-scheme:dark){svg{--bg:#0b0b0c;--fg:#f4f2ec;--mu:#8b8a85;--ln:#2a2a2c;--ac:#ff5a1f}}
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg)}.fg{fill:var(--fg)}.mu{fill:var(--mu)}.ac{fill:var(--ac)}
.lb{font-size:12px;letter-spacing:1.6px;fill:var(--mu)}
.fd{opacity:0;animation:fd .6s ease forwards}@keyframes fd{to{opacity:1}}
.nl{font-size:15px;font-weight:600;fill:var(--fg)}.vl{font-size:14px;font-weight:600;fill:var(--fg)}.tc{font-size:12px;fill:var(--mu)}
.br{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:gr 1.1s cubic-bezier(.2,.7,.2,1) forwards}@keyframes gr{to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.br{animation:none;transform:none}.fd{animation:none;opacity:1}}
</style>
