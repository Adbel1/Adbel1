<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" role="img" aria-label="Benja Díaz">
<style>svg{--bg:#f3f6fa;--fg:#0d1117;--mu:#5c6675;--ln:#d3dae4;--ac:#1f5fd6}
@media(prefers-color-scheme:dark){svg{--bg:#0a0e14;--fg:#eef2f7;--mu:#8792a2;--ln:#222b38;--ac:#4c8dff}}
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg)}.fg{fill:var(--fg)}.mu{fill:var(--mu)}.ac{fill:var(--ac)}
.lb{font-size:12px;letter-spacing:1.6px;fill:var(--mu)}
.fd{opacity:0;animation:fd .6s ease forwards}@keyframes fd{to{opacity:1}}
.nm{font-size:92px;font-weight:800;letter-spacing:-3.5px;fill:var(--fg)}
.ld{font-size:24px;font-weight:500;fill:var(--mu)}
.ro{font-size:24px;font-weight:600;fill:var(--fg);opacity:0;animation:ro 12s infinite}
.r1{animation-delay:4s}.r2{animation-delay:8s}
@keyframes ro{0%{opacity:0;transform:translateY(14px)}4%,29%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-14px)}}
.mk{animation:run 12s cubic-bezier(.6,0,.3,1) infinite}
@keyframes run{0%{transform:none}33.3%{transform:translateX(248px)}66.6%{transform:translateX(496px)}100%{transform:translateX(744px)}}
.dt{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}
.ri{opacity:0;animation:ri .9s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
@keyframes ri{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.ro,.mk,.dt,.ri{animation:none}.ri,.r0{opacity:1}}
</style>
<rect class="bg" width="840" height="320" rx="18"/>
<g class="m lb"><text x="48" y="50">ADBEL1 / README</text><circle class="dt ac" cx="690" cy="46" r="4"/><text x="792" y="50" text-anchor="end">FULL-STACK</text></g>
<text class="s nm ri" x="44" y="146">Benja Díaz</text>
<g class="s ri d1"><text class="ld" x="48" y="196">Construyo</text><text class="ro r0" x="182" y="196">productos digitales de punta a punta.</text><text class="ro r1" x="182" y="196">backends con DDD que el negocio entiende.</text><text class="ro r2" x="182" y="196">interfaces diseñadas con cuidado.</text></g>
<g class="ri d2">
<path d="M48 258.5H794" fill="none" stroke="var(--ln)" stroke-width="7" stroke-dasharray="1.5 6.25"/>
<path d="M48 255H794" fill="none" stroke="var(--mu)" stroke-width="14" stroke-dasharray="1.5 60.5"/>
<rect class="mk ac" x="46" y="240" width="5.5" height="22" rx="1"/></g>
<g class="m lb ri d3"><text x="48" y="288">FLUTTER · REACT NATIVE · NESTJS · SUPABASE</text><text x="792" y="288" text-anchor="end">CÓDIGO + DISEÑO</text></g>
</svg>
