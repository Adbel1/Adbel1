<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 396" role="img" aria-label="Habilidades">
<style>svg{--bg:#f3f6fa;--fg:#0d1117;--mu:#5c6675;--ln:#d3dae4;--ac:#1f5fd6}
@media(prefers-color-scheme:dark){svg{--bg:#0a0e14;--fg:#eef2f7;--mu:#8792a2;--ln:#222b38;--ac:#4c8dff}}
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg)}.fg{fill:var(--fg)}.mu{fill:var(--mu)}.ac{fill:var(--ac)}
.lb{font-size:12px;letter-spacing:1.6px;fill:var(--mu)}
.fd{opacity:0;animation:fd .6s ease forwards}@keyframes fd{to{opacity:1}}
.ct{font-size:17px;font-weight:700;fill:var(--fg)}.it{font-size:13px;fill:var(--mu)}.nb{font-size:11px;letter-spacing:1px;fill:var(--mu)}
.ic{fill:none;stroke:var(--ac);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ri{opacity:0;animation:ri .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes ri{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.ri{animation:none;opacity:1}}
</style>
